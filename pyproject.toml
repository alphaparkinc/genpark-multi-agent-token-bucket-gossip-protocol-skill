[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-multi-agent-token-bucket-gossip-protocol-skill"
version = "1.0.0"
description = "Peer-to-peer epidemic gossip protocol engine with token-bucket rate limiting for bounded network dissemination in autonomous agent swarms."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
